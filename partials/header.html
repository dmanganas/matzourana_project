<!-- ============================================================
     SHARED HEADER (source of truth). Edit here, then run:
         node tools/build-pages.js
     It is stamped into every page between @header markers.
     The seasonal greeting is NOT edited here: it comes from
     matzourana_messages.js (renderSeasonalMessages).
     ============================================================ -->
    <header>

            <video autoplay loop muted playsinline class="logo-video">
                <source src="MatzouranaImages/matzourana-autumn-october-movie-logo.mp4" type="video/mp4">
            </video>

            <!-- Seasonal header greeting: filled by renderSeasonalMessages() from matzourana_messages.js (this autumn text is only the no-JS fallback) -->
