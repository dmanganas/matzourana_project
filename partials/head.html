<!-- ============================================================
     SHARED <head> PART (source of truth): font + image preloads and the
     delayed Google Analytics loader. Stamped into every page between
     <!-- @head --> markers by:  node tools/build-pages.js
     ============================================================ -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="image" href="Logos/heart_decor-logo.webp" type="image/webp" fetchpriority="high">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@700&family=Open+Sans:wght@400&display=swap" rel="stylesheet">
    <!-- Google tag (gtag.js): queued at once, the library itself loads on first interaction or 4 s after page load -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-HYZYNG1DM0');
      /*-------------------
      Purpose: Load the Google Analytics library once, off the critical rendering path.
      On Input: none (called by the first scroll / tap / key press, or 4 s after 'load').
      On Output: none. Side effects: appends the async gtag.js <script> once.
      ---------------------*/
      function loadGtagLibrary() {
        if (window.__gtagLoaded) return;
        window.__gtagLoaded = true;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-HYZYNG1DM0';
        document.head.appendChild(s);
      }
      ['scroll', 'pointerdown', 'keydown', 'touchstart'].forEach(function (e) {
        window.addEventListener(e, loadGtagLibrary, { once: true, passive: true });
      });
      window.addEventListener('load', function () { setTimeout(loadGtagLibrary, 4000); });
    </script>
